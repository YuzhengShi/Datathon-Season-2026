[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funding-navigator-api"
version = "0.5.0"
description = "Shared data tools for funding search, conversational matching and regional analytics"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "pydantic-settings", "sqlalchemy>=2", "alembic", "openai", "tzdata",
    "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
